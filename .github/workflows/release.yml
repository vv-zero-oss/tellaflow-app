name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual release: builds the version in package.json and creates the
  # v<version> tag + GitHub release itself (no tag push needed).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish
    # Pinned: on the macOS 26 image electron-builder cannot unlock its temporary
    # signing keychain ("SecKeychainUnlock: passphrase not correct"); every
    # successful release so far was built on macOS 15.
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME (= $TAG_VERSION) does not match package.json version $PKG_VERSION"
              exit 1
            fi
          fi
          echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $PKG_VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Parakeet model
        uses: actions/cache@v4
        with:
          path: resources/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          key: parakeet-tdt-0.6b-v2-int8-v1

      - name: Download Parakeet model (if not cached)
        run: npm run download-parakeet

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build and sign .app
        # Notarization happens on the DMG only in the next step; Apple's notary
        # service recursively scans the .app inside, so we avoid paying the
        # round-trip twice (which was timing out at 60 min on the 1 GB bundle).
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: npx electron-builder --mac --publish never

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls dist/Tellaflow-*-arm64.dmg)
          echo "Submitting $DMG to Apple notary service..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          # Stapling fetches the ticket from Apple's CloudKit, whose connection
          # the runner sometimes drops ("The network connection was lost",
          # error 68) after notarization was already accepted: retry.
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::$* failed (attempt $i); retrying in $((i * 15))s"
              sleep $((i * 15))
            done
            return 1
          }
          retry xcrun stapler staple "$DMG"
          retry xcrun stapler validate "$DMG"

      - name: Verify signature and notarization
        run: |
          codesign -dv --verbose=2 dist/mac-arm64/Tellaflow.app
          spctl -a -vv dist/mac-arm64/Tellaflow.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On workflow_dispatch this creates the tag at the built commit.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Tellaflow-*-arm64.dmg
            dist/Tellaflow-*-arm64.dmg.blockmap
            dist/Tellaflow-*-arm64-mac.zip
            dist/Tellaflow-*-arm64-mac.zip.blockmap
            dist/latest-mac.yml
          draft: false
          generate_release_notes: true

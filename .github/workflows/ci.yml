name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # Native postinstall steps (whisper rpath fix-ups, Electron download)
      # are macOS/packaging concerns; unit tests don't need them.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck renderer
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build:renderer

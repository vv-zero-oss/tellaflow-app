appId: com.tellaflow.app
productName: Tellaflow
afterSign: scripts/after-sign.js
publish:
  provider: github
  owner: vv-zero-oss
  repo: tellaflow-app
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Tellaflow needs microphone access to transcribe your speech."
    NSAccessibilityUsageDescription: "Tellaflow needs accessibility access to detect your hotkey and paste transcribed text."
dmg:
  title: Tellaflow Installer
  background: build/background.png
  iconSize: 100
  window:
    width: 600
    height: 420
  contents:
    - x: 165
      y: 200
      type: file
    - x: 435
      y: 200
      type: link
      path: /Applications
extraResources:
  - from: resources/models/
    to: models/
    filter:
      - "ggml-*.bin"
  - from: resources/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    to: models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    filter:
      - "*.onnx"
      - "tokens.txt"
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png
files:
  - src/main/**/*
  - src/preload/**/*
  - src/renderer/audio-capture.html
  - src/renderer/meeting-capture.html
  - src/renderer/panel.html
  - native/mic-mode/mic-mode
  - dist/renderer/**/*
  - node_modules/**/*
  # Exclude cross-platform whisper binaries (arm64-only build)
  - "!node_modules/@kutalia/whisper-node-addon/dist/win32-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/linux-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/darwin-x64"
  - "!node_modules/@kutalia/whisper-node-addon/dist/mac-x64"
  # Exclude node-llama-cpp build-time artifacts (keep runtime binaries)
  - "!node_modules/node-llama-cpp/llama/llama.cpp"
  - "!node_modules/node-llama-cpp/llama/xpack"
asarUnpack:
  - native/mic-mode/mic-mode
  - node_modules/@kutalia/whisper-node-addon/**/*
  - node_modules/node-llama-cpp/**/*
  - node_modules/@node-llama-cpp/**/*
  - node_modules/better-sqlite3/**/*
  - src/main/grammar-worker.js
  - dist/renderer/*.mp4
  - dist/renderer/*.png
  - dist/renderer/*.svg
  - dist/renderer/*.woff2

appId: com.tellaflow.app
productName: Tellaflow
afterSign: scripts/after-sign.js
publish:
  provider: github
  owner: vv-zero-oss
  repo: tellaflow-app
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Tellaflow needs microphone access to transcribe your speech."
    NSAccessibilityUsageDescription: "Tellaflow needs accessibility access to detect your hotkey, paste transcribed text, and click and type in other apps when you ask the Assistant to."
    NSAppleEventsUsageDescription: "Tellaflow uses Apple Events to paste text and detect meetings in your browser."
dmg:
  title: Tellaflow Installer
  background: build/background.png
  iconSize: 100
  window:
    width: 600
    height: 420
  contents:
    - x: 165
      y: 200
      type: file
    - x: 435
      y: 200
      type: link
      path: /Applications
extraResources:
  - from: resources/models/
    to: models/
    filter:
      - "ggml-*.bin"
  - from: resources/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    to: models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    filter:
      - "*.onnx"
      - "tokens.txt"
  # What Settings › Assistant › Download installs (bb, pinned by this
  # lockfile, on a pinned Node — src/main/jarvis/runtime.js). Neither ships in
  # the app: the assistant is opt-in.
  - from: resources/assistant-runtime/
    to: assistant-runtime/
    filter:
      - package.json
      - package-lock.json
  # The island bridge bb loads by path (src/main/jarvis/bb/island-bridge.js):
  # a real folder, since bb runs on plain Node and cannot read app.asar.
  - from: resources/bb-plugin-tellaflow/
    to: bb-plugin-tellaflow/
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png
files:
  - src/main/**/*
  - src/preload/**/*
  - src/renderer/audio-capture.html
  - src/renderer/panel.html
  - dist/renderer/**/*
  - node_modules/**/*
  # Exclude cross-platform whisper binaries (arm64-only build)
  - "!node_modules/@kutalia/whisper-node-addon/dist/win32-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/linux-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/darwin-x64"
  - "!node_modules/@kutalia/whisper-node-addon/dist/mac-x64"
asarUnpack:
  - node_modules/@kutalia/whisper-node-addon/**/*
  - node_modules/better-sqlite3/**/*
  - dist/renderer/*.mp4
  - dist/renderer/*.png
  - dist/renderer/*.svg
  - dist/renderer/*.woff2

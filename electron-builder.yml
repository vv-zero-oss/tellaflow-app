appId: com.tellaflow.app
productName: Tellaflow
afterSign: scripts/after-sign.js
publish:
  provider: github
  owner: vv-zero-oss
  repo: tellaflow-app
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Tellaflow needs microphone access to transcribe your speech."
    NSAccessibilityUsageDescription: "Tellaflow needs accessibility access to detect your hotkey, paste transcribed text, and click and type in other apps when you ask the Assistant to."
    NSAppleEventsUsageDescription: "Tellaflow uses Apple Events to paste text and detect meetings in your browser."
dmg:
  title: Tellaflow Installer
  background: build/background.png
  iconSize: 100
  window:
    width: 600
    height: 420
  contents:
    - x: 165
      y: 200
      type: file
    - x: 435
      y: 200
      type: link
      path: /Applications
extraResources:
  - from: resources/models/
    to: models/
    filter:
      - "ggml-*.bin"
  - from: resources/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    to: models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/
    filter:
      - "*.onnx"
      - "tokens.txt"
  # The Node runtime bb runs on (scripts/download-node.sh) — signed with the
  # app's own entitlements by electron-builder and notarized with the DMG.
  - from: resources/node/darwin-arm64/
    to: node/darwin-arm64/
  # The island bridge bb loads by path (src/main/jarvis/bb/island-bridge.js):
  # a real folder, since bb runs on plain Node and cannot read app.asar.
  - from: resources/bb-plugin-tellaflow/
    to: bb-plugin-tellaflow/
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png
files:
  - src/main/**/*
  - src/preload/**/*
  - src/renderer/audio-capture.html
  - src/renderer/panel.html
  - dist/renderer/**/*
  - node_modules/**/*
  # Exclude cross-platform whisper binaries (arm64-only build)
  - "!node_modules/@kutalia/whisper-node-addon/dist/win32-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/linux-*"
  - "!node_modules/@kutalia/whisper-node-addon/dist/darwin-x64"
  - "!node_modules/@kutalia/whisper-node-addon/dist/mac-x64"
asarUnpack:
  - node_modules/@kutalia/whisper-node-addon/**/*
  - node_modules/better-sqlite3/**/*
  # bb, the assistant's agent backend, runs as a plain-Node child and loads
  # native binaries (its own better-sqlite3, node-pty, @parcel/watcher), which
  # must be real files — supervisor.js rewrites the launcher to this copy…
  # …and everything bb-app needs, since plain Node cannot read inside app.asar
  # (tests/main/bb-unpack.test.js fails when a bb bump adds a dependency).
  - "node_modules/{@parcel/watcher*,@pinojs/redact,atomic-sleep,base64-js,bb-app,bindings,bl,buffer,colorette,date-fns,dateformat,decompress-response,deep-extend,detect-libc,end-of-stream,expand-template,fast-copy,fast-safe-stringify,file-uri-to-path,fs-constants,github-from-package,help-me,hono,ieee754,inherits,ini,is-extglob,is-glob,jiti,joycon,minimist,mkdirp-classic,napi-build-utils,node-pty,on-exit-leak-free,once,picomatch,pino,pino-abstract-transport,pino-pretty,pino-roll,pino-std-serializers,prebuild-install,process-warning,pump,quick-format-unescaped,rc,readable-stream,real-require,safe-buffer,safe-stable-stringify,secure-json-parse,simple-concat,simple-get,sonic-boom,split2,string_decoder,strip-json-comments,tar-fs,tar-stream,thread-stream,tunnel-agent,util-deprecate,wrappy,zod}/**/*"
  - dist/renderer/*.mp4
  - dist/renderer/*.png
  - dist/renderer/*.svg
  - dist/renderer/*.woff2

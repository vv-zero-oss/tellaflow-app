<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: rgba(28, 28, 32, 0.96);
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.06);
  --text: #e8e5e0;
  --text-dim: #8a877f;
  --accent: #d4a24e;
}
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'DM Sans', sans-serif;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}
.container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
}
.header h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.header-actions {
  display: flex;
  gap: 8px;
  -webkit-app-region: no-drag;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.entries {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.entries::-webkit-scrollbar { width: 6px; }
.entries::-webkit-scrollbar-track { background: transparent; }
.entries::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

.entry {
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}
.entry:hover { background: var(--surface-hover); }
.entry-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry-time {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  gap: 8px;
}
.empty-state svg { width: 32px; height: 32px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; opacity: 0.5; }
.empty-state p { font-size: 13px; }

.footer {
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.status-badge {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4a9e6d;
}
.status-dot.inactive { background: #8a877f; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Tellaflow</h1>
    <div class="header-actions">
      <button class="icon-btn" id="clearBtn" title="Clear history">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <div class="entries" id="entries"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/>
      <line x1="12" y1="17" x2="12" y2="22"/>
      <line x1="8" y1="22" x2="16" y2="22"/>
    </svg>
    <p>No transcriptions yet</p>
    <p style="font-size:11px;opacity:0.6;">Hold your hotkey and speak</p>
  </div>

  <div class="footer">
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusLabel">Ready</span>
    </div>
  </div>
</div>

<script>
const entriesEl = document.getElementById('entries');
const emptyEl = document.getElementById('emptyState');

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (isToday) return time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
}

function renderEntries(entries) {
  if (!entries || entries.length === 0) {
    entriesEl.style.display = 'none';
    emptyEl.style.display = 'flex';
    return;
  }
  entriesEl.style.display = 'block';
  emptyEl.style.display = 'none';

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  entriesEl.innerHTML = entries.map(e => `
    <div class="entry" data-text="${esc(e.text)}">
      <div class="entry-text">${esc(e.text)}</div>
      <div class="entry-time">${esc(formatTime(e.timestamp))}</div>
    </div>
  `).join('');

  entriesEl.querySelectorAll('.entry').forEach(el => {
    el.addEventListener('click', () => {
      window.tellaflow.copyToClipboard(el.dataset.text);
    });
  });
}

document.getElementById('clearBtn').addEventListener('click', () => {
  window.tellaflow.clearHistory();
  renderEntries([]);
});

window.tellaflow.onHistoryUpdate((entries) => {
  renderEntries(entries);
});

window.tellaflow.onStatusChange((status) => {
  document.getElementById('statusLabel').textContent = status;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (status === 'Ready' ? '' : ' inactive');
});

window.tellaflow.getHistory().then(entries => renderEntries(entries));
</script>
</body>
</html>

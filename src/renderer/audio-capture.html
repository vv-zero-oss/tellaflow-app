<!DOCTYPE html>
<html>
<head><title>Audio Capture</title></head>
<body>
<script>
let audioCtx = null;
let mediaStream = null;
let scriptNode = null;
let pcmChunks = [];
let isCapturing = false;
let stopRequested = false;
let startingUp = false;

const TARGET_SAMPLE_RATE = 16000;

// Streaming chunked transcription: after CHUNK_THRESHOLD_SEC of recording,
// start flushing audio to the main process every CHUNK_INTERVAL_SEC so
// transcription runs in parallel with recording. Prevents OOM on very long
// dictation sessions and reduces wait time when the user stops.
const CHUNK_THRESHOLD_SEC = 120; // 2 minutes before first flush
const CHUNK_INTERVAL_SEC = 30;   // subsequent flushes every 30 s
const SAMPLES_PER_BUFFER = 4096; // ScriptProcessor buffer size
const CHUNK_THRESHOLD_BUFFERS = Math.ceil((CHUNK_THRESHOLD_SEC * TARGET_SAMPLE_RATE) / SAMPLES_PER_BUFFER);
const CHUNK_INTERVAL_BUFFERS = Math.ceil((CHUNK_INTERVAL_SEC * TARGET_SAMPLE_RATE) / SAMPLES_PER_BUFFER);

let chunkingActive = false;
let sentChunkCount = 0;         // how many pcmChunks entries have been sent
let buffersSinceLastFlush = 0;  // buffers accumulated since last chunk flush

async function startCapture(deviceId, audioNoiseReduction) {
  if (isCapturing || startingUp) return;
  startingUp = true;
  stopRequested = false;
  pcmChunks = [];
  chunkingActive = false;
  sentChunkCount = 0;
  buffersSinceLastFlush = 0;

  const audioConstraints = { sampleRate: { ideal: TARGET_SAMPLE_RATE }, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  if (deviceId && deviceId !== 'auto') {
    audioConstraints.deviceId = { exact: deviceId };
  }

  try {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
    } catch (deviceErr) {
      // Fallback to default device if the specific device is unavailable
      if (deviceId && deviceId !== 'auto') {
        console.warn('Selected mic unavailable, falling back to default:', deviceErr.message);
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: { ideal: TARGET_SAMPLE_RATE }, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
      } else {
        throw deviceErr;
      }
    }

    if (stopRequested) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      startingUp = false;
      console.log('Stop was requested during mic init — sending empty audio.');
      window.tellaflow.sendAudio(new Float32Array(0));
      return;
    }

    audioCtx = new AudioContext({ sampleRate: TARGET_SAMPLE_RATE });
    const source = audioCtx.createMediaStreamSource(mediaStream);

    scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
    scriptNode.onaudioprocess = (e) => {
      if (!isCapturing) return;
      const input = e.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(input));

      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);
      window.tellaflow.sendAudioLevel(rms);

      // Streaming chunked transcription: once we cross the 2-min mark,
      // flush accumulated audio and then flush every 30 s thereafter.
      if (!chunkingActive) {
        if (pcmChunks.length >= CHUNK_THRESHOLD_BUFFERS) {
          chunkingActive = true;
          flushChunk();
        }
      } else {
        buffersSinceLastFlush++;
        if (buffersSinceLastFlush >= CHUNK_INTERVAL_BUFFERS) {
          flushChunk();
        }
      }
    };

    // Build audio graph: optionally insert filters for noise reduction
    if (audioNoiseReduction) {
      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 80;
      highpass.Q.value = 0.7;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 7500;
      lowpass.Q.value = 0.7;

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -24;
      compressor.knee.value = 12;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.25;

      source.connect(highpass);
      highpass.connect(lowpass);
      lowpass.connect(compressor);
      compressor.connect(scriptNode);
    } else {
      source.connect(scriptNode);
    }
    scriptNode.connect(audioCtx.destination);

    isCapturing = true;
    startingUp = false;

    if (stopRequested) {
      stopCapture();
    }
  } catch (err) {
    console.error('Microphone capture failed:', err);
    startingUp = false;
    isCapturing = false;
    // Send an empty buffer so the main process tears down this hidden window
    // and broadcasts 'Ready'. Without this the window leaks and every later
    // "Start Recording" silently bails out via the audioCaptureWindow guard.
    try { window.tellaflow.sendAudio(new Float32Array(0)); } catch {}
  }
}

function flushChunk() {
  const unsent = pcmChunks.slice(sentChunkCount);
  if (unsent.length === 0) return;

  const totalLength = unsent.reduce((sum, c) => sum + c.length, 0);
  const merged = new Float32Array(totalLength);
  let offset = 0;
  for (const chunk of unsent) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  sentChunkCount = pcmChunks.length;
  buffersSinceLastFlush = 0;
  window.tellaflow.sendAudioChunk(merged);
}

function stopCapture() {
  if (startingUp) {
    console.log('Stop requested while mic is starting up — will stop after init.');
    stopRequested = true;
    return;
  }

  if (!isCapturing) return;
  isCapturing = false;

  if (scriptNode) {
    scriptNode.disconnect();
    scriptNode = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }

  const wasChunking = chunkingActive;

  // If chunking was active, only send the remaining unsent tail.
  // Prior chunks were already dispatched for transcription via flushChunk().
  const sliceStart = wasChunking ? sentChunkCount : 0;
  const remaining = pcmChunks.slice(sliceStart);

  const totalLength = remaining.reduce((sum, c) => sum + c.length, 0);
  const merged = new Float32Array(totalLength);
  let offset = 0;
  for (const chunk of remaining) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }

  // Reset streaming state for next recording
  pcmChunks = [];
  chunkingActive = false;
  sentChunkCount = 0;
  buffersSinceLastFlush = 0;

  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }

  // For short (non-chunked) recordings, skip if the audio is just silence.
  // For chunked recordings, always send — the main process already has prior
  // chunks and needs this final event to assemble the result.
  if (!wasChunking) {
    let rms = 0;
    for (let i = 0; i < merged.length; i++) {
      rms += merged[i] * merged[i];
    }
    rms = Math.sqrt(rms / (merged.length || 1));

    if (rms < 0.005) {
      console.log('No speech detected (RMS too low). Sending empty audio for cleanup.');
      window.tellaflow.sendAudio(new Float32Array(0));
      return;
    }
  }

  // Send the Float32Array as-is — Electron IPC uses structured clone, which
  // preserves typed arrays. Avoids the O(n) Array.from() conversion (~480k
  // samples for a 30s clip) and roughly halves the IPC payload size.
  window.tellaflow.sendAudio(merged);
}

window.tellaflow.onStartRecording((data) => startCapture(data?.deviceId, data?.audioNoiseReduction !== false));
window.tellaflow.onStopRecording(() => stopCapture());

window.tellaflow.sendCaptureReady();
</script>
</body>
</html>
